<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | NFT preview card component</title>
  </head>
  <body>
    <main class="card-container">
      <div class="nft-product-img-wrapper">
        <img
          class="nft-product-img"
          src="images/image-equilibrium.jpg"
          alt="NFT Product Image"
        />
      </div>
      <p class="nft-name">Equilibrium #3429</p>
      <p class="nft-description">
        Our Equilibrium collection promotes balance and calm.
      </p>
      <div class="price-and-time-container">
        <p>
          <img src="images/icon-ethereum.svg" alt="" />
          0.041 ETH
        </p>
        <p>
          <img src="images/icon-clock.svg" alt="" />
          3 days left
        </p>
      </div>

      <hr />

      <div class="creator-container">
        <img src="images/image-avatar.png" alt="" />
        <p>Creation of <span> Jules Wyvern</span></p>
      </div>
    </main>

    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by
      <a
        href="https://github.com/ikram-muhr/frontend-mentor-challenges/tree/main/newbie/5-nft-review-card-component"
        target="_blank"
        >Ikram-Muhr</a
      >.
    </div>
  </body>
</html>
