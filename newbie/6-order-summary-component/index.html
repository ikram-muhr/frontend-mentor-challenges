<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | Order summary card</title>
  </head>
  <body>
    <main class="card-container">
      <img src="images/illustration-hero.svg" alt="Illustration Image" />
      <h1 class="fw-bold">Order Summary</h1>
      <p class="text-description">
        You can now listen to millions of songs, audiobooks, and podcasts on any
        device anywhere you like!
      </p>
      <div class="pricing-plan-container">
        <div>
          <img src="images/icon-music.svg" alt="" />
          <div>
            <p class="fw-bold">Annual Plan</p>
            <p>$59.99/year</p>
          </div>
        </div>
        <p><a href="#">Change</a></p>
      </div>
      <button class="btn btn-payment fw-bold">Proceed to Payment</button>
      <button class="btn btn-cancel-order fw-bold">Cancel Order</button>
    </main>

    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by
      <a
        href="https://github.com/ikram-muhr/frontend-mentor-challenges/tree/main/newbie/6-order-summary-component"
        target="_blank"
        >Ikram-Muhr</a
      >.
    </div>
  </body>
</html>
