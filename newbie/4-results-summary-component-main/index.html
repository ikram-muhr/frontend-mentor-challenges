<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Results summary component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  </head>
  <body>
    <main class="result-card-container">
      <div class="result-card-point">
        <h3 class="txt-light-lavender">Your Result</h3>
        <div class="circle">
          <p>76</p>
          <span class="txt-light-lavender">of 100</span>
        </div>

        <h2>Great</h2>
        <p class="result-card-text txt-light-lavender">
          You scored higher than 65% of the people who have taken these tests.
        </p>
      </div>

      <div class="summary-card-container">
        <h3 class="txt-medium">Summary</h3>
        <div class="summary-list-container">
          <div class="bg-red">
            <p class="red txt-medium">
              <img
                src="assets/images/icon-reaction.svg"
                alt="icon-reaction"
              />Reaction
            </p>
            <p>
              <span class="txt-medium">80 </span
              ><span class="percentage">/ 100</span>
            </p>
          </div>
          <div class="bg-yellow">
            <p class="yellow txt-medium">
              <img src="assets/images/icon-memory.svg" alt="icon-memory" />
              Memory
            </p>
            <p>
              <span class="txt-medium">92 </span
              ><span class="percentage">/ 100</span>
            </p>
          </div>
          <div class="bg-green">
            <p class="green txt-medium">
              <img src="assets/images/icon-verbal.svg" alt="icon-verbal" />
              Verbal
            </p>
            <p>
              <span class="txt-medium">61 </span
              ><span class="percentage">/ 100</span>
            </p>
          </div>
          <div class="bg-blue">
            <p class="blue txt-medium">
              <img src="assets/images/icon-visual.svg" alt="" />
              Visual
            </p>
            <p>
              <span class="txt-medium">72 </span
              ><span class="percentage">/ 100</span>
            </p>
          </div>
        </div>

        <button class="txt-bold">Continue</button>
      </div>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by
      <a
        href="https://github.com/ikram-muhr/frontend-mentor-challenges/tree/main/newbie/4-results-summary-component-main"
        target="_blank"
        >Ikram-Muhr</a
      >.
    </footer>
  </body>
</html>
